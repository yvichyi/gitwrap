plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.yvichyi.sciencegallery'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.yvichyi.sciencegallery'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    sourceSets {
        main {
            // Reuse the original experiments; no duplicate or generated asset copies.
            assets.srcDirs = ["${rootDir}/../science-collection"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
