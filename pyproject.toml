[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitwrap"
version = "1.0.0"
description = "Your year in code — a Spotify-Wrapped-style annual report from your git history."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["git", "wrapped", "annual-report", "statistics", "developer-tools"]
authors = [{ name = "gitwrap contributors" }]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/yvichyi/gitwrap"

[project.scripts]
gitwrap = "gitwrap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gitwrap"]
