name: Science collection checks

on:
  pull_request:
    paths:
      - "science-collection/**"
      - ".github/workflows/science-collection.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: science-collection/package-lock.json
      - name: Static collection checks
        working-directory: science-collection
        run: python3 scripts/check.py
      - name: Install browser test dependency
        working-directory: science-collection
        run: npm ci
      - name: Install Chromium
        working-directory: science-collection
        run: npx playwright install --with-deps chromium
      - name: Browser regression suite
        working-directory: science-collection
        run: npm run test:browser

  gitwrap-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run gitwrap unit tests
        run: python -m unittest discover -s tests -v
