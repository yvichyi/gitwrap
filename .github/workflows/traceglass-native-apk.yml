name: Build TRACEGLASS Native APK
on:
  push:
    branches:
      - build/traceglass-android-native-v04
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Reconstruct native Android project
        shell: bash
        run: |
          cat traceglass-build-payload/part*.b64 | base64 -d > traceglass-native-project.zip
          unzip -q traceglass-native-project.zip
          test -f traceglass-native/app/src/main/java/app/traceglass/mobile/MainActivity.java
          test -f traceglass-native/app/src/main/assets/index.html

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build native debug APK
        shell: bash
        run: gradle -p traceglass-native --no-daemon :app:assembleDebug

      - name: Verify APK signature and structure
        shell: bash
        run: |
          APK=traceglass-native/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: Emulator cold-start smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            APK=traceglass-native/app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop app.traceglass.mobile
            adb shell am start -W -n app.traceglass.mobile/.MainActivity
            sleep 4
            PID="$(adb shell pidof app.traceglass.mobile | tr -d '\r')"
            test -n "$PID"
            adb shell dumpsys activity activities | grep -F "app.traceglass.mobile/.MainActivity"
            adb exec-out screencap -p > traceglass-smoke.png
            test -s traceglass-smoke.png

      - name: Upload APK and smoke screenshot
        uses: actions/upload-artifact@v4
        with:
          name: TRACEGLASS-v0.4-native-verified
          path: |
            traceglass-native/app/build/outputs/apk/debug/app-debug.apk
            traceglass-smoke.png
          if-no-files-found: error
          retention-days: 7
